name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'
    - run: npm ci
    - run: npm run lint
    - run: npm run fmt:check

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # A Windows-only failure must not cancel the other runs
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22.x, 24.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run build
    # `test:local`/`test:dist` set the variable POSIX-style, which cmd.exe (npm's script shell on
    # Windows) can not run — the target is set by the step instead
    - run: npm test
      env:
        TEST_TARGET: local
    - run: npm test
      env:
        TEST_TARGET: dist
