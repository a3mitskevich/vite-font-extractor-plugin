name: Release

on:
  push:
    branches: [ "master" ]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # npm trusted publishing (OIDC): no long-lived token, provenance is generated automatically
      id-token: write

    steps:
    - uses: actions/checkout@v4
    # No `registry-url`: it writes `_authToken=${NODE_AUTH_TOKEN}` to .npmrc, and an empty token there
    # makes npm skip the OIDC exchange. registry.npmjs.org is npm's default registry anyway
    - uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'
    # Trusted publishing needs npm 11.5.1+, the npm bundled with Node may be older
    - run: npm install -g npm@11
    - run: npm ci
    - run: npm run build

    - name: Create Release Pull Request or Publish
      id: changesets
      uses: changesets/action@v1
      with:
        publish: npm run release
        version: npm run version
        title: 'chore: version packages'
        commit: 'chore: version packages'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
